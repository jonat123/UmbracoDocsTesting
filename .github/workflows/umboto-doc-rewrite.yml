name: Umboto Doc Rewrite

on:
  push:
    paths:
      - "**/*.md"   # Trigger on Markdown changes anywhere

jobs:
  rewrite-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run:  pip install openai==0.28.1

      - name: Run Umboto rewrite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/umboto_rewrite.py

      - name: Commit and push rewritten docs
        run: |
          git config --global user.name "Umboto Bot"
          git config --global user.email "actions@github.com"
          git add rewritten
          git commit -m "Umboto rewrite for updated docs"
          git push
