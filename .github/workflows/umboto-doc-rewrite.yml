name: Umboto Doc Rewrite

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"

jobs:
  rewrite-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so git diff works for multiple commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai==0.28.1

      - name: Run Umboto rewrite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/umboto_rewrite.py

      - name: Commit and push rewritten docs
        if: success()
        run: |
          git config --global user.name "Umboto Bot"
          git config --global user.email "actions@github.com"
          git add rewritten || true
          git commit -m "Umboto rewrite for updated docs" || echo "No changes to commit"
          git push || echo "No changes to push"
